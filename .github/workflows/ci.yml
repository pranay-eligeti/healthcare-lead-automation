name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: Run tests
        run: pytest -q
      - name: Offline sample
        run: python -m src.pipeline --input sample_data/leads.csv --specialty cardiology --state OH --output scratch/cardiology.csv
